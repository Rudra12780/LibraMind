      <text x="48" y="48" font-size="11" font-weight="bold">LIBRAMIND SANCTUARY // SCHOLAR REGISTRATION BLUEPRINT</text>
      <text x="590" y="48" font-size="9.5" fill="#666666">Page 15 of 21 · Balsamiq Low-Fidelity</text>

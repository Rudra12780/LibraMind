        <rect x="0" y="24" width="130" height="7" rx="3" fill="#666666" />
        <rect x="0" y="37" width="110" height="7" rx="3" fill="#888888" />
        <rect x="0" y="50" width="125" height="7" rx="3" fill="#888888" />

        <rect x="0" y="24" width="90" height="7" rx="3" fill="#666666" />
        <rect x="0" y="37" width="110" height="7" rx="3" fill="#888888" />
        <rect x="0" y="50" width="80" height="7" rx="3" fill="#888888" />
      </g>

      <g transform="translate(580, 24)">

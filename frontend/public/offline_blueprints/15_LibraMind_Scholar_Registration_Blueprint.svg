        <rect x="0" y="24" width="140" height="7" rx="3" fill="#666666" />
        <rect x="0" y="37" width="120" height="7" rx="3" fill="#888888" />
        <rect x="0" y="50" width="100" height="7" rx="3" fill="#888888" />
      </g>

      <g transform="translate(320, 24)">

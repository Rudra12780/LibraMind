    </g>

    <!-- ════════════════════════════════════════════════════════════════════ -->
    <!-- 3. STATUS BAR (LIVE STATS RIBBON) -->
    <!-- ════════════════════════════════════════════════════════════════════ -->
    <g transform="translate(0, 329)">

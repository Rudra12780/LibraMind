  <!-- Technical Wireframe Annotations Footnote -->
  <g transform="translate(45, 955)">
    <text x="0" y="0" font-size="10" fill="#444444">ANNOTATION CRITERIA: PURE B&amp;W OUTLINES · IMAGE PLACEHOLDER [X] BOXES · HORIZONTAL DUMMY LINE TEXT · 2D TOP-DOWN WIREFRAME</text>

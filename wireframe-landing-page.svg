        <rect x="26" y="196" width="60" height="6" rx="2" fill="#555555" />

        <!-- Primary Button Box ('Borrow') -->
        <rect x="16" y="218" width="210" height="28" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.6" />
        <line x1="75" y1="232" x2="165" y2="232" stroke="#000000" stroke-width="3" stroke-linecap="round" />

        <!-- Secondary Buttons Split -->
        <rect x="16" y="252" width="100" height="24" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1" />
        <line x1="36" y1="264" x2="96" y2="264" stroke="#666666" stroke-width="2" stroke-linecap="round" />

        <rect x="126" y="252" width="100" height="24" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1" />
        <line x1="146" y1="264" x2="206" y2="264" stroke="#666666" stroke-width="2" stroke-linecap="round" />
      </g>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" width="100%" height="100%" style="background-color: #FFFFFF; font-family: 'Comic Sans MS', 'Chalkboard SE', 'Plus Jakarta Sans', -apple-system, sans-serif;">
  <defs>
    <!-- Faint Dot Grid Background for Design Thinking Wireframing Canvas -->
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#D4D4D4" />
    </pattern>
    <!-- Subtle Box Shadow for Browser Canvas -->
    <filter id="wireframe-shadow" x="-3%" y="-2%" width="106%" height="106%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Canvas Dot-Grid Background -->
  <rect width="1200" height="980" fill="url(#dot-grid)" />

  <!-- Wireframe Blueprint Header Card (Design Thinking Tag) -->
  <g transform="translate(40, 24)">
    <rect x="0" y="0" width="1120" height="42" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" rx="6" />
    <text x="18" y="26" font-size="13" font-weight="bold" fill="#000000" letter-spacing="1">DESIGN THINKING PROJECT // LOW-FIDELITY UI WIREFRAME</text>
    <text x="760" y="26" font-size="11" fill="#555555">STYLE: BALSAMIQ MINIMAL B&amp;W · DESKTOP VIEW (1120px)</text>
  </g>

  <!-- Main Browser Window Wireframe Frame -->
  <g transform="translate(40, 80)" filter="url(#wireframe-shadow)">
    <!-- Browser Outline -->
    <rect width="1120" height="850" fill="#FFFFFF" stroke="#000000" stroke-width="2" rx="8" />

    <!-- Browser Chrome Header -->
    <rect width="1120" height="34" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" rx="8 8 0 0" />
    <!-- Window Control Buttons (Circles) -->
    <circle cx="20" cy="17" r="4.5" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" />
    <circle cx="35" cy="17" r="4.5" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" />
    <circle cx="50" cy="17" r="4.5" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" />
    <!-- Browser Address URL Bar -->
    <rect x="75" y="7" width="560" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="1.2" rx="4" />
    <text x="90" y="21" font-size="10" fill="#333333">http://libramind.edu/home</text>

    <!-- ════════════════════════════════════════════════════════════════════ -->
    <!-- 1. NAVIGATION BAR -->
    <!-- ════════════════════════════════════════════════════════════════════ -->
    <g transform="translate(0, 34)">
      <!-- Section Tag -->
      <rect x="940" y="6" width="160" height="18" fill="#FFFFFF" stroke="#000000" stroke-width="1" stroke-dasharray="3,3" rx="3" />
      <text x="952" y="19" font-size="9" font-weight="bold" fill="#000000">[SECTION: NAVIGATION BAR]</text>

      <rect width="1120" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" />
      
      <!-- Brand Logo Box with 'X' -->
      <g transform="translate(24, 12)">
        <rect width="36" height="36" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" rx="6" />
        <line x1="0" y1="0" x2="36" y2="36" stroke="#999999" stroke-width="1" />
        <line x1="0" y1="36" x2="36" y2="0" stroke="#999999" stroke-width="1" />
      </g>
      <!-- Logo Text Placeholder -->
      <rect x="70" y="18" width="90" height="12" rx="3" fill="#000000" />
      <rect x="70" y="34" width="60" height="6" rx="2" fill="#888888" />

      <!-- Navigation Links (Placeholder horizontal pill/bars) -->
      <g transform="translate(340, 24)">
        <rect x="0" y="0" width="46" height="12" rx="3" fill="#333333" />
        <rect x="66" y="0" width="46" height="12" rx="3" fill="#777777" />
        <rect x="132" y="0" width="64" height="12" rx="3" fill="#333333" stroke="#000000" stroke-width="1" />
        <rect x="216" y="0" width="70" height="12" rx="3" fill="#777777" />
        <rect x="306" y="0" width="64" height="12" rx="3" fill="#777777" />
        <rect x="390" y="0" width="56" height="12" rx="3" fill="#777777" />
      </g>

      <!-- Member Hub Button & Profile Outline -->
      <g transform="translate(860, 14)">
        <rect width="90" height="32" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
        <text x="22" y="21" font-size="11" font-weight="bold" fill="#000000">My Hub</text>

        <!-- User Profile Circle with 'X' -->
        <g transform="translate(104, 0)">
          <circle cx="16" cy="16" r="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" />
          <line x1="5" y1="5" x2="27" y2="27" stroke="#999999" stroke-width="1" />
          <line x1="5" y1="27" x2="27" y2="5" stroke="#999999" stroke-width="1" />
        </g>
      </g>
    </g>

    <!-- ════════════════════════════════════════════════════════════════════ -->
    <!-- 2. HERO BANNER -->
    <!-- ════════════════════════════════════════════════════════════════════ -->
    <g transform="translate(0, 94)">
      <!-- Outer Hero Container -->
      <rect width="1120" height="235" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" />
      
      <!-- Section Label Floating Tag -->
      <rect x="24" y="14" width="130" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="1.2" stroke-dasharray="3,3" rx="4" />
      <text x="34" y="28" font-size="10" font-weight="bold" fill="#000000">[HERO BANNER]</text>

      <!-- Pill Badge Placeholder (Top of Hero) -->
      <rect x="440" y="24" width="240" height="24" rx="12" fill="#FFFFFF" stroke="#000000" stroke-width="1.4" stroke-dasharray="4,3" />
      <line x1="470" y1="36" x2="650" y2="36" stroke="#555555" stroke-width="4" stroke-linecap="round" />

      <!-- Main Headline (Placeholder Text Bars: Large High-Fidelity Silhouette) -->
      <g transform="translate(560, 75)" text-anchor="middle">
        <rect x="-260" y="0" width="520" height="20" rx="4" fill="#111111" />
        <rect x="-180" y="28" width="360" height="18" rx="4" fill="#333333" />
      </g>

      <!-- Subtitle Description (Placeholder Thin Lines) -->
      <g transform="translate(560, 134)" text-anchor="middle">
        <rect x="-240" y="0" width="480" height="7" rx="3.5" fill="#777777" />
        <rect x="-170" y="12" width="340" height="7" rx="3.5" fill="#999999" />
      </g>

      <!-- ════════════════════════════════════════════════════════════════ -->
      <!-- 2.1 SEARCH BAR -->
      <!-- ════════════════════════════════════════════════════════════════ -->
      <g transform="translate(260, 166)">
        <!-- Search Container -->
        <rect width="600" height="46" rx="12" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
        
        <!-- Magnifying Glass Wireframe Icon -->
        <circle cx="26" cy="23" r="7" fill="none" stroke="#000000" stroke-width="1.8" />
        <line x1="31" y1="28" x2="38" y2="35" stroke="#000000" stroke-width="2" stroke-linecap="round" />
        
        <!-- Search Input Placeholder Line -->
        <rect x="52" y="18" width="280" height="10" rx="3" fill="#AAAAAA" />

        <!-- Search Button Box -->
        <rect x="475" y="6" width="118" height="34" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
        <text x="502" y="28" font-size="11" font-weight="bold" fill="#000000">SEARCH BAR</text>

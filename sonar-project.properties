sonar.projectKey=Rudra12780_LibraMind
sonar.organization=rudra12780

# Source directories for analysis
sonar.sources=backend,frontend/src

# Exclude temporary scratch files, scripts, uploaded SVG assets, docs, and generated files
sonar.exclusions=**/node_modules/**,**/scratch/**,**/scripts/**,**/uploads/**,**/public/uploads/**,**/*.html,**/*.pdf,**/*.pptx,**/*.zip,**/*.svg,**/*.db*,backend/add_spiritual_classics.js,backend/download_original_covers.js,backend/add_curated_books.js,frontend/dist/**

# Exclusions for duplication detection (CPD)
sonar.cpd.exclusions=**/scratch/**,**/scripts/**,**/test*/**,backend/add_spiritual_classics.js,backend/db/seed.js,backend/add_curated_books.js,**/uploads/**,frontend/src/pages/TermsPolicies.jsx

# Coverage exclusions
sonar.coverage.exclusions=**/*
